name: WP-04 Contract Validation

on:
  push:
    paths:
      - 'experiments/p1/wp04-real-executor-smoke-v1.json'
      - 'experiments/p1/wp04-executor-binding-v1.template.json'
      - 'experiments/p1/wp04-executor-binding-v2.template.json'
      - 'experiments/p1/wp04-stage1-d-f5-01-v1.json'
      - 'experiments/p1/wp04-stage1-result-r1.json'
      - 'experiments/p1/wp04-stage2-d-f6-01-v1.json'
      - 'tools/ndv_validate_wp04_smoke.py'
      - 'tools/test_ndv_validate_wp04_smoke.py'
      - 'tools/ndv_verify_df501_structural.py'
      - 'tools/test_ndv_verify_df501_structural.py'
      - 'tools/ndv_verify_df601_structural.py'
      - 'tools/test_ndv_verify_df601_structural.py'
      - 'tools/ndv_run_wp04_stage1_df501.py'
      - 'tools/ndv_run_wp04_stage2_df601.py'
      - 'tools/test_ndv_run_wp04_stage2_df601.py'
      - 'tools/ndv_import_wp04_stage_run.py'
      - 'tools/test_ndv_import_wp04_stage_run.py'
      - '.github/workflows/wp04-contract-validation.yml'
  pull_request:
    paths:
      - 'experiments/p1/wp04-real-executor-smoke-v1.json'
      - 'experiments/p1/wp04-executor-binding-v1.template.json'
      - 'experiments/p1/wp04-executor-binding-v2.template.json'
      - 'experiments/p1/wp04-stage1-d-f5-01-v1.json'
      - 'experiments/p1/wp04-stage1-result-r1.json'
      - 'experiments/p1/wp04-stage2-d-f6-01-v1.json'
      - 'tools/ndv_validate_wp04_smoke.py'
      - 'tools/test_ndv_validate_wp04_smoke.py'
      - 'tools/ndv_verify_df501_structural.py'
      - 'tools/test_ndv_verify_df501_structural.py'
      - 'tools/ndv_verify_df601_structural.py'
      - 'tools/test_ndv_verify_df601_structural.py'
      - 'tools/ndv_run_wp04_stage1_df501.py'
      - 'tools/ndv_run_wp04_stage2_df601.py'
      - 'tools/test_ndv_run_wp04_stage2_df601.py'
      - 'tools/ndv_import_wp04_stage_run.py'
      - 'tools/test_ndv_import_wp04_stage_run.py'
      - '.github/workflows/wp04-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NDV
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile WP-04 tooling
        run: |
          python -m py_compile tools/ndv_validate_wp04_smoke.py
          python -m py_compile tools/ndv_verify_df501_structural.py
          python -m py_compile tools/ndv_verify_df601_structural.py
          python -m py_compile tools/ndv_run_wp04_stage1_df501.py
          python -m py_compile tools/ndv_run_wp04_stage2_df601.py
          python -m py_compile tools/ndv_import_wp04_stage_run.py

      - name: Validate frozen campaign
        run: python tools/ndv_validate_wp04_smoke.py

      - name: Run WP-04 tests
        working-directory: tools
        run: |
          python -m unittest -v test_ndv_validate_wp04_smoke.py
          python -m unittest -v test_ndv_verify_df501_structural.py
          python -m unittest -v test_ndv_verify_df601_structural.py
          python -m unittest -v test_ndv_import_wp04_stage_run.py
          python -m unittest -v test_ndv_run_wp04_stage2_df601.py
