name: WP-06 Corpus Intake Validation

on:
  push:
    paths:
      - 'experiments/p1/s2-*.json'
      - 'tools/ndv_*s2*.py'
      - 'tools/test_ndv_*s2*.py'
      - '.github/workflows/wp06-corpus-intake-validation.yml'
  pull_request:
    paths:
      - 'experiments/p1/s2-*.json'
      - 'tools/ndv_*s2*.py'
      - 'tools/test_ndv_*s2*.py'
      - '.github/workflows/wp06-corpus-intake-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile S2 admission tooling
        run: |
          python -m py_compile tools/ndv_acquire_s2_pinned_parquet.py
          python -m py_compile tools/ndv_materialize_s2_wave.py
          python -m py_compile tools/ndv_prepare_s2_base_audit_plan.py
          python -m py_compile tools/ndv_acquire_s2_images.py
          python -m py_compile tools/ndv_bind_s2_audit_plan_images.py
          python -m py_compile tools/ndv_execute_s2_base_audit_plan.py
          python -m py_compile tools/ndv_interpret_s2_base_audit_batch.py
          python -m py_compile tools/ndv_build_s2_verifier_batch.py
          python -m py_compile tools/ndv_build_s2_candidate_state.py
          python -m py_compile tools/ndv_apply_s2_family_assignments.py
          python -m py_compile tools/ndv_assemble_s2_audit_state.py
          python -m py_compile tools/ndv_validate_corpus_intake.py
          python -m py_compile tools/ndv_extract_pinned_swe_rebench_rows.py
          python -m py_compile tools/ndv_quarantine_swe_rebench_rows.py
          python -m py_compile tools/ndv_run_s2_base_audit.py
          python -m py_compile tools/ndv_interpret_s2_base_oracle.py
          python -m py_compile tools/ndv_build_s2_verifier_evidence.py
          python -m py_compile tools/ndv_validate_s2_audit.py
          python -m py_compile tools/ndv_decide_s2_admission.py
          python -m py_compile tools/ndv_freeze_s2_admission.py

      - name: Validate frozen pre-execution state
        run: |
          python tools/ndv_validate_corpus_intake.py experiments/p1/s2-candidate-wave-01.json
          python tools/ndv_validate_s2_audit.py experiments/p1/s2-audit-state-01.json
          python - <<'PY'
          import json, sys
          env=json.load(open('experiments/p1/s2-extraction-environment-v1.json'))
          assert env['schema_id']=='ndv-p1-s2-extraction-environment-v1'
          assert (env['python']['required_major'],env['python']['required_minor'])==sys.version_info[:2]
          assert env['pyarrow']['required_version']=='25.0.1'
          assert env['network_during_extraction']=='FORBIDDEN'
          assert env['treatment_execution']=='NOT_EXECUTED' and env['holdout_access']=='NONE'
          taxonomy=json.load(open('experiments/p1/s2-family-taxonomy-v1.json'))
          assert taxonomy['schema_id']=='ndv-p1-s2-family-taxonomy-v1'
          assert set(taxonomy['families'])=={'F1','F2','F3','F4','F5','F6'}
          assert taxonomy['performance_based_assignment'] is False
          audit=json.load(open('experiments/p1/s2-verifier-environment-audit-v2.json'))
          layout=audit['instance_image_layout']
          assert layout['revision']=='c71902a8cf8d2b725f63d51f199f4d3e56f68d2d'
          assert layout['path']=='combine.Dockerfile.j2'
          assert layout['git_blob_sha']=='b87c412bab0906e054f3c49f653a9b792e4ab7f6'
          assert layout['project_dir_rule']=='/<repo-name>' and layout['workdir_rule']=='WORKDIR project_dir'
          assert 'immutable image RepoDigest matching frozen image repository' in audit['base_runner']['required_integrity']
          PY

      - name: Run S2 admission unit tests
        working-directory: tools
        run: |
          python -m unittest -v test_ndv_acquire_s2_pinned_parquet.py
          python -m unittest -v test_ndv_materialize_s2_wave.py
          python -m unittest -v test_ndv_prepare_s2_base_audit_plan.py
          python -m unittest -v test_ndv_acquire_s2_images.py
          python -m unittest -v test_ndv_bind_s2_audit_plan_images.py
          python -m unittest -v test_ndv_execute_s2_base_audit_plan.py
          python -m unittest -v test_ndv_interpret_s2_base_audit_batch.py
          python -m unittest -v test_ndv_build_s2_verifier_batch.py
          python -m unittest -v test_ndv_build_s2_candidate_state.py
          python -m unittest -v test_ndv_apply_s2_family_assignments.py
          python -m unittest -v test_ndv_assemble_s2_audit_state.py
          python -m unittest -v test_ndv_validate_corpus_intake.py
          python -m unittest -v test_ndv_extract_pinned_swe_rebench_rows.py
          python -m unittest -v test_ndv_quarantine_swe_rebench_rows.py
          python -m unittest -v test_ndv_s2_quarantine_indices.py
          python -m unittest -v test_ndv_run_s2_base_audit.py
          python -m unittest -v test_ndv_interpret_s2_base_oracle.py
          python -m unittest -v test_ndv_build_s2_verifier_evidence.py
          python -m unittest -v test_ndv_validate_s2_audit.py
          python -m unittest -v test_ndv_decide_s2_admission.py
          python -m unittest -v test_ndv_freeze_s2_admission.py
