      - 'tools/test_ndv_promote_wp04_binding_to_wp07.py'
      - 'tools/ndv_wp07_preflight.py'
      - 'tools/test_ndv_wp07_preflight.py'
      - 'tools/ndv_materialize_wp07_run_matrix.py'
      - 'tools/test_ndv_materialize_wp07_run_matrix.py'
      - 'tools/ndv_release_wp07_development_comparison.py'
      - 'tools/test_ndv_release_wp07_development_comparison.py'
      - '.github/workflows/wp07-release-gate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile WP-07 gates
        run: |
          python -m py_compile tools/ndv_validate_wp07_protocol.py
          python -m py_compile tools/ndv_assess_wp07_binding_readiness.py
          python -m py_compile tools/ndv_probe_wp07_subscription_surfaces.py
          python -m py_compile tools/ndv_wp07_codex_bundle.py
          python -m py_compile tools/ndv_qualify_codex_subscription_executor.py
          python -m py_compile tools/ndv_batch_qualify_codex_subscription.py
          python -m py_compile tools/ndv_promote_codex_bindings_to_wp07.py
          python -m py_compile tools/ndv_freeze_wp07_b3_family_policy.py
          python -m py_compile tools/ndv_preflight_wp07_codex_run_spec.py
          python -m py_compile tools/ndv_compile_wp07_codex_prompt.py
          python -m py_compile tools/ndv_parse_codex_jsonl_usage.py
          python -m py_compile tools/ndv_materialize_wp07_codex_workspace.py
          python -m py_compile tools/ndv_run_wp07_codex_single_hop.py
          python -m py_compile tools/ndv_verify_wp07_codex_single_hop.py
          python -m py_compile tools/ndv_promote_wp04_binding_to_wp07.py
          python -m py_compile tools/ndv_wp07_preflight.py
          python -m py_compile tools/ndv_materialize_wp07_run_matrix.py
          python -m py_compile tools/ndv_release_wp07_development_comparison.py
      - name: Validate frozen comparison protocol
        run: python tools/ndv_validate_wp07_protocol.py experiments/p1/wp07-development-comparison-protocol-v1.json
      - name: Validate frozen Codex contracts
        run: |
          python - <<'PY'
          import json, pathlib
          checks = [
              ('experiments/p1/wp07-codex-execution-surface-v1.json','ndv-p1-wp07-codex-execution-surface-v1'),
              ('experiments/p1/wp07-codex-treatment-execution-v1.json','ndv-p1-wp07-codex-treatment-execution-v1'),
              ('experiments/p1/wp07-execution-budgets-v1.json','ndv-p1-wp07-execution-budgets-v1'),
          ]
          for raw, schema in checks:
              p=pathlib.Path(raw); x=json.loads(p.read_text())
              assert x['schema_id']==schema
              assert x['status']=='PROSPECTIVE_FROZEN_NOT_EXECUTED'
              assert x['holdout_access']=='NONE'
              assert x['treatment_execution']=='NOT_EXECUTED'
          budgets=json.loads(pathlib.Path('experiments/p1/wp07-execution-budgets-v1.json').read_text())
          assert budgets['executor_timeout_ms_per_hop']==1800000
          assert budgets['verification_reserve_ms']==1800000
          assert budgets['treatments']['B0']['retry_limit']==0
          assert budgets['treatments']['B2']['escalation_limit']==1
          template=json.loads(pathlib.Path('experiments/p1/run-spec-v1.template.json').read_text())
          assert template['schema_id']=='p1-run-spec-v1' and 'budgets' in template
          a=json.loads(pathlib.Path('experiments/p1/run-accounting-contract-v1.json').read_text())
          f=json.loads(pathlib.Path('experiments/p1/failure-attribution-v1.json').read_text())
          assert a['contract_id']=='p1-run-accounting-v1' and a['no_composite_score'] is True
          assert f['contract_id']=='p1-failure-attribution-v1' and 'PRODUCT_FAILURE' in f['classes']
          PY
      - name: Validate executor role qualification program without task exposure
        run: python tools/ndv_probe_wp07_subscription_surfaces.py
      - name: Assess current binding coverage
        run: python tools/ndv_assess_wp07_binding_readiness.py --registry experiments/p1/wp07-treatment-bindings-v1.json
      - name: Test WP-07 gates
        working-directory: tools
        run: |
          python -m unittest -v test_ndv_validate_wp07_protocol.py
          python -m unittest -v test_ndv_assess_wp07_binding_readiness.py
          python -m unittest -v test_ndv_probe_wp07_subscription_surfaces.py
          python -m unittest -v test_ndv_wp07_codex_bundle.py
          python -m unittest -v test_ndv_qualify_codex_subscription_executor.py
          python -m unittest -v test_ndv_batch_qualify_codex_subscription.py
          python -m unittest -v test_ndv_promote_codex_bindings_to_wp07.py
          python -m unittest -v test_ndv_freeze_wp07_b3_family_policy.py
          python -m unittest -v test_ndv_preflight_wp07_codex_run_spec.py
          python -m unittest -v test_ndv_compile_wp07_codex_prompt.py
          python -m unittest -v test_ndv_parse_codex_jsonl_usage.py
          python -m unittest -v test_ndv_materialize_wp07_codex_workspace.py
          python -m unittest -v test_ndv_run_wp07_codex_single_hop.py
          python -m unittest -v test_ndv_verify_wp07_codex_single_hop.py
          python -m unittest -v test_ndv_promote_wp04_binding_to_wp07.py
          python -m unittest -v test_ndv_wp07_preflight.py
          python -m unittest -v test_ndv_materialize_wp07_run_matrix.py
          python -m unittest -v test_ndv_release_wp07_development_comparison.py
