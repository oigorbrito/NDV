      - 'experiments/p1/run-spec-v1.template.json'
      - 'experiments/p1/run-accounting-contract-v1.json'
      - 'experiments/p1/failure-attribution-v1.json'
      - 'tools/ndv_validate_wp07_protocol.py'
      - 'tools/test_ndv_validate_wp07_protocol.py'
