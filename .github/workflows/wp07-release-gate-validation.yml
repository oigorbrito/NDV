      - 'tools/test_ndv_promote_codex_bindings_to_wp07.py'
      - 'tools/ndv_freeze_wp07_b3_family_policy.py'
      - 'tools/test_ndv_freeze_wp07_b3_family_policy.py'
      - 'tools/ndv_preflight_wp07_codex_run_spec.py'
      - 'tools/test_ndv_preflight_wp07_codex_run_spec.py'
      - 'tools/ndv_compile_wp07_codex_prompt.py'
      - 'tools/test_ndv_compile_wp07_codex_prompt.py'
      - 'tools/ndv_parse_codex_jsonl_usage.py'
      - 'tools/test_ndv_parse_codex_jsonl_usage.py'
      - 'tools/ndv_materialize_wp07_codex_workspace.py'
      - 'tools/test_ndv_materialize_wp07_codex_workspace.py'
      - 'tools/ndv_run_wp07_codex_single_hop.py'
      - 'tools/test_ndv_run_wp07_codex_single_hop.py'
