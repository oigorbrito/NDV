name: Repository Steward Readiness Observer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  observe:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/readiness-observe'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Query GitHub-native readiness state
        id: query
        shell: bash
        run: |
          set -euo pipefail

          classify() {
            local state="$1"
            local draft="$2"
            local merge_state="$3"
            local mergeable="$4"
            local checks="$5"

            if [[ "$state" != "OPEN" ]]; then
              printf '%s' "NOT_READY_STATE"
            elif [[ "$draft" == "true" ]]; then
              printf '%s' "NOT_READY_DRAFT"
            elif [[ "$merge_state" == "DIRTY" || "$mergeable" == "CONFLICTING" ]]; then
              printf '%s' "NOT_READY_CONFLICT"
            elif [[ "$merge_state" == "BLOCKED" ]]; then
              printf '%s' "NOT_READY_BLOCKED"
            elif [[ "$merge_state" == "BEHIND" ]]; then
              printf '%s' "NOT_READY_BEHIND"
            elif [[ "$merge_state" == "UNSTABLE" || "$checks" != "SUCCESS" ]]; then
              printf '%s' "NOT_READY_CHECKS"
            elif [[ "$merge_state" == "CLEAN" && "$mergeable" == "MERGEABLE" && "$checks" == "SUCCESS" ]]; then
              printf '%s' "READY_FOR_MERGE_CANDIDATE"
            else
              printf '%s' "READINESS_UNKNOWN"
            fi
          }

          assert_case() {
            local expected="$1"
            shift
            local actual
            actual="$(classify "$@")"
            if [[ "$actual" != "$expected" ]]; then
              echo "classifier test failed: expected=$expected actual=$actual inputs=$*" >&2
              exit 1
            fi
          }

          # Exercise the fail-closed rule before observing a real pull request.
          assert_case READY_FOR_MERGE_CANDIDATE OPEN false CLEAN MERGEABLE SUCCESS
          assert_case NOT_READY_STATE CLOSED false CLEAN MERGEABLE SUCCESS
          assert_case NOT_READY_DRAFT OPEN true CLEAN MERGEABLE SUCCESS
          assert_case NOT_READY_CONFLICT OPEN false DIRTY CONFLICTING SUCCESS
          assert_case NOT_READY_BLOCKED OPEN false BLOCKED MERGEABLE SUCCESS
          assert_case NOT_READY_BEHIND OPEN false BEHIND MERGEABLE SUCCESS
          assert_case NOT_READY_CHECKS OPEN false CLEAN MERGEABLE PENDING
          assert_case NOT_READY_CHECKS OPEN false CLEAN MERGEABLE NONE
          assert_case READINESS_UNKNOWN OPEN false UNKNOWN UNKNOWN SUCCESS
          echo "CLASSIFIER_MATRIX=PASS"

          query='
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                number
                state
                isDraft
                baseRefName
                headRefName
                headRefOid
                mergeable
                mergeStateStatus
                reviewDecision
                statusCheckRollup {
                  state
                }
              }
            }
          }'

          gh api graphql \
            -f query="$query" \
            -F owner="$OWNER" \
            -F name="$REPO" \
            -F number="$PR_NUMBER" \
            > response.json

          jq -e '.data.repository.pullRequest != null' response.json >/dev/null

          state="$(jq -r '.data.repository.pullRequest.state' response.json)"
          draft="$(jq -r '.data.repository.pullRequest.isDraft' response.json)"
          base="$(jq -r '.data.repository.pullRequest.baseRefName' response.json)"
          head="$(jq -r '.data.repository.pullRequest.headRefName' response.json)"
          head_sha="$(jq -r '.data.repository.pullRequest.headRefOid' response.json)"
          mergeable="$(jq -r '.data.repository.pullRequest.mergeable' response.json)"
          merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' response.json)"
          review="$(jq -r '.data.repository.pullRequest.reviewDecision // "NONE"' response.json)"
          checks="$(jq -r '.data.repository.pullRequest.statusCheckRollup.state // "NONE"' response.json)"
          decision="$(classify "$state" "$draft" "$merge_state" "$mergeable" "$checks")"

          echo "OBSERVATION state=$state draft=$draft mergeStateStatus=$merge_state mergeable=$mergeable reviewDecision=$review checks=$checks base=$base head=$head head_sha=$head_sha decision=$decision"

          {
            echo "## Repository Steward Readiness Observer"
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- state: $state"
            echo "- draft: $draft"
            echo "- base: $base"
            echo "- head: $head"
            echo "- head SHA: $head_sha"
            echo "- mergeable: $mergeable"
            echo "- mergeStateStatus: $merge_state"
            echo "- reviewDecision: $review"
            echo "- statusCheckRollup: $checks"
            echo "- decision: $decision"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Assert report-only decision
        shell: bash
        run: |
          case "${{ steps.query.outputs.decision }}" in
            READY_FOR_MERGE_CANDIDATE|NOT_READY_STATE|NOT_READY_DRAFT|NOT_READY_CHECKS|NOT_READY_CONFLICT|NOT_READY_BLOCKED|NOT_READY_BEHIND|READINESS_UNKNOWN)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac
