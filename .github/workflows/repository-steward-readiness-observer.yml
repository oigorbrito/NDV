name: Repository Steward Readiness Observer

on:
  workflow_run:
    workflows: ['*', '!Repository Steward Readiness Observer']
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  observe:
    if: >
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'dynamic')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      (github.event.comment.body == '/readiness-observe' || github.event.comment.body == '/readiness-observe-v2' || github.event.comment.body == '/readiness-observe-v1'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.issue.number }}
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      READINESS_VERSION: ${{ github.event.comment.body == '/readiness-observe-v1' && 'v1' || 'v2' }}
    steps:
      - name: Check out the default-branch classifier
        uses: actions/checkout@v4

      - name: Associate completed CI with the current pull request
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source .github/scripts/repository-steward-readiness-run-association.sh
            query='query($owner:String!, $name:String!, $sha:GitObjectID!) {
              repository(owner:$owner, name:$name) {
                object(oid:$sha) { ... on Commit {
                  associatedPullRequests(first:100) {
                    nodes { number state headRefOid }
                    pageInfo { hasNextPage }
                  }
                } }
              }
            }'
            gh api graphql -f query="$query" -F owner="$OWNER" -F name="$REPO" -f sha="$SOURCE_HEAD" > association.json
            if ! PR_NUMBER="$(readiness_associate_run association.json "$SOURCE_HEAD")"; then
              echo "ASSOCIATION source_run=$SOURCE_RUN source_head=$SOURCE_HEAD decision=READINESS_UNKNOWN"
              echo "READINESS_UNKNOWN: no unique current OPEN PR for CI head $SOURCE_HEAD" >> "$GITHUB_STEP_SUMMARY"
              echo "observe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "ASSOCIATION source_run=$SOURCE_RUN source_head=$SOURCE_HEAD pr=$PR_NUMBER"
          echo "observe=true" >> "$GITHUB_OUTPUT"

      - name: Query GitHub-native readiness state
        id: query
        if: steps.target.outputs.observe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/repository-steward-readiness-classifier.sh

          query='
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                number
                state
                isDraft
                baseRefName
                headRefName
                headRefOid
                mergeable
                mergeStateStatus
                reviewDecision
                statusCheckRollup {
                  state
                }
              }
            }
          }'

          gh api graphql \
            -f query="$query" \
            -F owner="$OWNER" \
            -F name="$REPO" \
            -F number="$PR_NUMBER" \
            > response.json

          jq -e '.data.repository.pullRequest != null' response.json >/dev/null

          if [[ "$READINESS_VERSION" == v2 ]]; then
            source .github/scripts/repository-steward-readiness-classifier-v2.sh
            if extracted="$(readiness_extract_v2 response.json)"; then
              IFS=$'\t' read -r state draft base head head_sha mergeable merge_state review checks <<< "$extracted"
              decision="$(readiness_classify_v2 "$state" "$draft" "$merge_state" "$mergeable" "$checks" "$review")"
            else
              state=UNKNOWN draft=UNKNOWN base=UNKNOWN head=UNKNOWN head_sha=UNKNOWN
              mergeable=UNKNOWN merge_state=UNKNOWN review=UNKNOWN checks=UNKNOWN
              decision=READINESS_UNKNOWN
            fi
          else
            state="$(jq -r '.data.repository.pullRequest.state' response.json)"
            draft="$(jq -r '.data.repository.pullRequest.isDraft' response.json)"
            base="$(jq -r '.data.repository.pullRequest.baseRefName' response.json)"
            head="$(jq -r '.data.repository.pullRequest.headRefName' response.json)"
            head_sha="$(jq -r '.data.repository.pullRequest.headRefOid' response.json)"
            mergeable="$(jq -r '.data.repository.pullRequest.mergeable' response.json)"
            merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' response.json)"
            review="$(jq -r '.data.repository.pullRequest.reviewDecision // "NONE"' response.json)"
            checks="$(jq -r '.data.repository.pullRequest.statusCheckRollup.state // "NONE"' response.json)"
            decision="$(readiness_classify "$state" "$draft" "$merge_state" "$mergeable" "$checks")"
          fi

          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$head_sha" != "$SOURCE_HEAD" ]]; then
            decision=READINESS_UNKNOWN
          fi

          echo "OBSERVATION state=$state draft=$draft mergeStateStatus=$merge_state mergeable=$mergeable reviewDecision=$review checks=$checks base=$base head=$head head_sha=$head_sha decision=$decision protocol=$READINESS_VERSION"

          {
            echo "## Repository Steward Readiness Observer"
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- protocol: $READINESS_VERSION"
            echo "- state: $state"
            echo "- draft: $draft"
            echo "- base: $base"
            echo "- head: $head"
            echo "- head SHA: $head_sha"
            echo "- mergeable: $mergeable"
            echo "- mergeStateStatus: $merge_state"
            echo "- reviewDecision: $review"
            echo "- statusCheckRollup: $checks"
            echo "- decision: $decision"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Assert report-only decision
        if: steps.target.outputs.observe == 'true'
        shell: bash
        run: |
          case "${{ steps.query.outputs.decision }}" in
            READY_FOR_MERGE_CANDIDATE|NOT_READY_STATE|NOT_READY_DRAFT|NOT_READY_CHECKS|NOT_READY_CONFLICT|NOT_READY_BLOCKED|NOT_READY_BEHIND|NOT_READY_REVIEW|READINESS_UNKNOWN)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac
