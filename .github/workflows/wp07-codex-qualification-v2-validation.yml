name: WP-07 Codex Qualification V2 Validation

on:
  push:
    paths:
      - 'experiments/p1/wp07-codex-qualification-amendment-v2.json'
      - 'tools/ndv_wp07_codex_bundle.py'
      - 'tools/test_ndv_wp07_codex_bundle.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v2.py'
      - '.github/workflows/wp07-codex-qualification-v2-validation.yml'
  pull_request:
    paths:
      - 'experiments/p1/wp07-codex-qualification-amendment-v2.json'
      - 'tools/ndv_wp07_codex_bundle.py'
      - 'tools/test_ndv_wp07_codex_bundle.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v2.py'
      - '.github/workflows/wp07-codex-qualification-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile qualifier v2
        run: |
          python -m py_compile tools/ndv_wp07_codex_bundle.py
          python -m py_compile tools/ndv_qualify_codex_subscription_executor_v2.py
      - name: Validate frozen amendment
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('experiments/p1/wp07-codex-qualification-amendment-v2.json')
          x=json.loads(p.read_text())
          assert x['schema_id']=='ndv-p1-wp07-codex-qualification-amendment-v2'
          assert x['status']=='PROSPECTIVE_AMENDMENT_FROZEN_NOT_EXECUTED'
          assert x['historical_v1_evidence_reinterpretation']=='FORBIDDEN'
          assert x['identity_policy']['required_cli_version_exact']=='0.154.0'
          assert x['upstream_provenance']['release_commit']=='6b9826e3aa83b1a5947db50f4332cb9c65f1b340'
          assert x['upstream_provenance']['model_cli_source']['git_blob_sha']=='5e525662d49ce0697ff6965473be178378443776'
          assert x['upstream_provenance']['jsonl_schema_source']['git_blob_sha']=='30df7f176a02c5283405a70fac2d5ef9acdcb66e'
          assert x['development_task_exposure'] is False
          assert x['holdout_access']=='NONE'
          assert x['treatment_execution']=='NOT_EXECUTED'
          PY
      - name: Test qualifier v2
        working-directory: tools
        run: |
          python -m unittest -v test_ndv_wp07_codex_bundle.py
          python -m unittest -v test_ndv_qualify_codex_subscription_executor_v2.py
