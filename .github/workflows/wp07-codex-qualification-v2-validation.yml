name: WP-07 Codex Qualification V2/V3 Validation

on:
  push:
    paths:
      - 'experiments/p1/wp07-codex-qualification-amendment-v2.json'
      - 'experiments/p1/wp07-codex-qualification-amendment-v3.json'
      - 'tools/ndv_wp07_codex_bundle.py'
      - 'tools/test_ndv_wp07_codex_bundle.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v3.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v3.py'
      - '.github/workflows/wp07-codex-qualification-v2-validation.yml'
  pull_request:
    paths:
      - 'experiments/p1/wp07-codex-qualification-amendment-v2.json'
      - 'experiments/p1/wp07-codex-qualification-amendment-v3.json'
      - 'tools/ndv_wp07_codex_bundle.py'
      - 'tools/test_ndv_wp07_codex_bundle.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v2.py'
      - 'tools/ndv_qualify_codex_subscription_executor_v3.py'
      - 'tools/test_ndv_qualify_codex_subscription_executor_v3.py'
      - '.github/workflows/wp07-codex-qualification-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile qualifiers
        run: |
          python -m py_compile tools/ndv_wp07_codex_bundle.py
          python -m py_compile tools/ndv_qualify_codex_subscription_executor_v2.py
          python -m py_compile tools/ndv_qualify_codex_subscription_executor_v3.py
      - name: Validate frozen amendments
        run: |
          python - <<'PY'
          import json, pathlib
          v2=json.loads(pathlib.Path('experiments/p1/wp07-codex-qualification-amendment-v2.json').read_text())
          assert v2['schema_id']=='ndv-p1-wp07-codex-qualification-amendment-v2'
          assert v2['historical_v1_evidence_reinterpretation']=='FORBIDDEN'
          assert v2['identity_policy']['required_cli_version_exact']=='0.154.0'
          assert v2['upstream_provenance']['release_commit']=='6b9826e3aa83b1a5947db50f4332cb9c65f1b340'
          v3=json.loads(pathlib.Path('experiments/p1/wp07-codex-qualification-amendment-v3.json').read_text())
          assert v3['schema_id']=='ndv-p1-wp07-codex-qualification-amendment-v3'
          assert v3['status']=='PROSPECTIVE_AMENDMENT_FROZEN_NOT_EXECUTED'
          assert v3['historical_v1_v2_evidence_reinterpretation']=='FORBIDDEN'
          assert v3['workspace_policy']['sandbox_mode']=='workspace-write'
          assert v3['workspace_policy']['explicit_writable_root']=='synthetic-workspace exact absolute path via --add-dir'
          assert v3['workspace_policy']['authority_expansion']=='NONE_BEYOND_SYNTHETIC_WORKSPACE'
          assert v3['identity_policy']['required_cli_version_exact']=='0.154.0'
          assert v3['decision_rules']['environment_failure_marker_present_and_mutation_not_exact']=='S0_ENVIRONMENT_BLOCKED'
          assert v3['upstream_provenance']['release_commit']=='6b9826e3aa83b1a5947db50f4332cb9c65f1b340'
          assert v3['development_task_exposure'] is False
          assert v3['holdout_access']=='NONE'
          assert v3['treatment_execution']=='NOT_EXECUTED'
          PY
      - name: Test qualifiers
        working-directory: tools
        run: |
          python -m unittest -v test_ndv_wp07_codex_bundle.py
          python -m unittest -v test_ndv_qualify_codex_subscription_executor_v2.py
          python -m unittest -v test_ndv_qualify_codex_subscription_executor_v3.py
